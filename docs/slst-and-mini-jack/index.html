<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="bmstable" content="./header.json">
  <meta name="description" content="sl/st(指ガチ統合)">
  <title>sl/st(指ガチ統合)</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <main class="container table-page" data-table-slug="slst-and-mini-jack">
    <nav class="back"><a href="../">← 難易度表一覧へ</a></nav>
    <header class="hero compact">
      <p class="eyebrow">BMS DIFFICULTY TABLE</p>
      <h1 id="table-title">sl/st(指ガチ統合)</h1>
      <div id="table-description" class="description">説明はありません。</div>
      <div class="meta-row">
        <span id="chart-count" class="pill">譜面数を読込中</span>
        <span id="updated-at" class="pill"></span>
      </div>
      <div class="button-row">
        <button id="copy-page-url" type="button">ページURLをコピー</button>
        <button id="copy-header-url" type="button">header.json URLをコピー</button>
        <a class="button secondary" href="./header.json">header.json</a>
        <a class="button secondary" href="./data.json">data.json</a>
      </div>
    </header>
    <section class="toolbar sticky-toolbar">
      <input id="chart-search" type="search" placeholder="曲名・アーティスト・レベルから検索" autocomplete="off">
      <select id="level-filter"><option value="">すべてのレベル</option></select>
      <span id="visible-count" class="muted"></span>
    </section>
    <section class="table-wrap">
      <table>
        <thead><tr><th>Lv</th><th>Title</th><th>Artist</th><th>Links</th></tr></thead>
        <tbody id="chart-body"></tbody>
      </table>
    </section>
    <p id="load-error" class="error" hidden></p>
  </main>
  <script src="../assets/table.js"></script>
</body>
</html>
